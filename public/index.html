<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>NDC Sizer — Netwrix Data Classification Sizing Tool</title>
<style>
  :root {
    --blue: #1B3A6B;
    --blue-light: #2A5298;
    --accent: #E8702A;
    --accent2: #4CAF87;
    --bg: #F4F6FA;
    --card: #FFFFFF;
    --border: #DDE3EE;
    --text: #1A2340;
    --muted: #6B7A99;
    --warn: #E67E22;
    --success: #27AE60;
    --danger: #E74C3C;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  /* Header */
  .header { background: linear-gradient(135deg, var(--blue) 0%, var(--blue-light) 100%); color: #fff; padding: 20px 32px; display: flex; align-items: center; gap: 16px; box-shadow: 0 2px 12px rgba(0,0,0,.2); }
  .header-logo { width: 44px; height: 44px; background: rgba(255,255,255,.15); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 22px; }
  .header h1 { font-size: 22px; font-weight: 700; letter-spacing: -.3px; }
  .header p { font-size: 13px; opacity: .75; margin-top: 2px; }

  /* Layout */
  .container { max-width: 1400px; margin: 0 auto; padding: 28px 24px; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  @media (max-width: 900px) { .grid-2, .grid-3 { grid-template-columns: 1fr; } }

  /* Cards */
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 22px 24px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
  .card-title { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
  .card-title .icon { font-size: 16px; }

  /* Input area */
  .scan-row { display: flex; gap: 10px; margin-bottom: 14px; }
  .scan-row input { flex: 1; border: 1.5px solid var(--border); border-radius: 8px; padding: 10px 14px; font-size: 14px; outline: none; transition: border .2s; background: #F9FAFB; }
  .scan-row input:focus { border-color: var(--blue-light); background: #fff; }
  .btn { border: none; border-radius: 8px; padding: 10px 20px; font-size: 14px; font-weight: 600; cursor: pointer; transition: .2s; display: inline-flex; align-items: center; gap: 7px; }
  .btn-primary { background: var(--blue); color: #fff; }
  .btn-primary:hover { background: var(--blue-light); }
  .btn-primary:disabled { opacity: .5; cursor: not-allowed; }
  .btn-success { background: var(--accent2); color: #fff; }
  .btn-success:hover { filter: brightness(1.1); }
  .btn-orange { background: var(--accent); color: #fff; }
  .btn-orange:hover { filter: brightness(1.1); }

  .toggle-row { display: flex; gap: 8px; margin-bottom: 16px; }
  .toggle-btn { border: 1.5px solid var(--border); background: #F9FAFB; color: var(--text); border-radius: 8px; padding: 8px 16px; font-size: 13px; font-weight: 600; cursor: pointer; transition: .15s; }
  .toggle-btn.active { background: var(--blue); color: #fff; border-color: var(--blue); }

  /* Progress */
  .progress-wrap { display: none; margin-top: 10px; }
  .progress-wrap.visible { display: block; }
  .progress-bar-bg { background: #E8EDFB; border-radius: 99px; height: 8px; overflow: hidden; }
  .progress-bar { background: linear-gradient(90deg, var(--blue), var(--accent)); height: 100%; border-radius: 99px; width: 0%; transition: width .3s; animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.7; } }
  .progress-label { font-size: 12px; color: var(--muted); margin-top: 6px; }

  /* Stat cards */
  .stat-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px; text-align: center; }
  .stat-value { font-size: 28px; font-weight: 800; color: var(--blue); line-height: 1.1; }
  .stat-label { font-size: 12px; color: var(--muted); margin-top: 4px; font-weight: 600; text-transform: uppercase; letter-spacing: .5px; }

  /* Tier badge */
  .tier-badge { display: inline-block; padding: 5px 14px; border-radius: 99px; font-size: 13px; font-weight: 700; letter-spacing: .3px; }
  .tier-poc { background: #E8F5E9; color: var(--success); }
  .tier-mid { background: #FFF3E0; color: var(--warn); }
  .tier-large { background: #FDECEA; color: var(--danger); }
  .tier-xl { background: #3B1F1F; color: #F5B7B1; }

  /* Recommendation table */
  .rec-table { width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 8px; }
  .rec-table th { background: var(--blue); color: #fff; padding: 10px 14px; text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .5px; }
  .rec-table th:first-child { border-radius: 8px 0 0 0; }
  .rec-table th:last-child { border-radius: 0 8px 0 0; }
  .rec-table td { padding: 10px 14px; border-bottom: 1px solid var(--border); }
  .rec-table tr:last-child td { border-bottom: none; }
  .rec-table tr:hover td { background: #F4F6FA; }
  .rec-table .val { font-weight: 700; color: var(--blue-light); }

  /* Tree */
  .tree-wrap { max-height: 420px; overflow-y: auto; font-size: 13px; }
  .tree-node { padding: 5px 8px; border-radius: 6px; cursor: default; transition: background .1s; display: flex; align-items: center; gap: 6px; }
  .tree-node:hover { background: #EFF3FB; }
  .tree-node .node-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tree-node .node-size { color: var(--muted); font-size: 12px; min-width: 70px; text-align: right; }
  .tree-node .node-files { color: var(--muted); font-size: 11px; min-width: 60px; text-align: right; }
  .tree-children { padding-left: 18px; border-left: 2px solid #EEF0F8; margin-left: 14px; }
  .tree-toggle { cursor: pointer; color: var(--blue-light); font-size: 11px; width: 16px; }

  /* Bar chart */
  .bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; font-size: 13px; }
  .bar-label { width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); }
  .bar-bg { flex: 1; background: #EEF0F8; border-radius: 99px; height: 12px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--blue), var(--blue-light)); min-width: 2px; transition: width .5s; }
  .bar-val { width: 70px; text-align: right; font-size: 12px; color: var(--muted); font-weight: 600; }

  /* Export row */
  .export-row { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }

  /* Empty state */
  .empty { text-align: center; padding: 48px 24px; color: var(--muted); }
  .empty .empty-icon { font-size: 52px; margin-bottom: 12px; opacity: .4; }
  .empty p { font-size: 14px; }

  /* Notes box */
  .notes-box { background: #FFFBF0; border: 1px solid #FFE082; border-radius: 8px; padding: 12px 16px; font-size: 13px; color: #795548; margin-top: 14px; line-height: 1.6; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #C5CDE0; border-radius: 99px; }
</style>
</head>
<body>

<div class="header">
  <div class="header-logo">📊</div>
  <div>
    <h1>NDC Sizer</h1>
    <p>Netwrix Data Classification — Storage Sizing &amp; Hardware Recommendations</p>
  </div>
</div>

<div class="container">

  <!-- Scan Panel -->
  <div class="card" style="margin-bottom:20px">
    <div class="card-title"><span class="icon">🔍</span> Scan Configuration</div>
    <div class="toggle-row">
      <button class="toggle-btn active" id="btn-local" onclick="setMode('local')">💻 Local Drive</button>
      <button class="toggle-btn" id="btn-network" onclick="setMode('network')">🌐 Network Share</button>
    </div>
    <div id="local-panel">
      <div class="scan-row">
        <select id="drive-select" style="border:1.5px solid var(--border);border-radius:8px;padding:10px 14px;font-size:14px;background:#F9FAFB;outline:none;min-width:160px;">
          <option value="">Loading drives…</option>
        </select>
        <input type="text" id="local-path" placeholder="Or type a custom path, e.g. C:\Users\Data" />
        <button class="btn btn-primary" onclick="startScan()">▶ Scan</button>
      </div>
    </div>
    <div id="network-panel" style="display:none">
      <div class="scan-row">
        <input type="text" id="network-path" placeholder="\\server\share  or  //server/share" style="flex:1"/>
        <button class="btn btn-primary" onclick="startScan()">▶ Scan</button>
      </div>
    </div>
    <div class="progress-wrap" id="progress-wrap">
      <div class="progress-bar-bg"><div class="progress-bar" id="progress-bar"></div></div>
      <div class="progress-label" id="progress-label">Scanning…</div>
    </div>
  </div>

  <!-- Results (hidden until scan) -->
  <div id="results" style="display:none">

    <!-- KPI row -->
    <div class="grid-3" style="margin-bottom:20px" id="kpi-row"></div>

    <div class="grid-2" style="margin-bottom:20px">

      <!-- Tree -->
      <div class="card">
        <div class="card-title"><span class="icon">📁</span> Directory Tree</div>
        <div class="tree-wrap" id="tree-container"></div>
      </div>

      <!-- Top folders chart -->
      <div class="card">
        <div class="card-title"><span class="icon">📊</span> Top Folders by Size</div>
        <div id="chart-container"></div>
      </div>

    </div>

    <!-- NDC Recommendation -->
    <div class="card" style="margin-bottom:20px">
      <div class="card-title"><span class="icon">🖥️</span> NDC Hardware Recommendations</div>
      <div id="rec-container"></div>
    </div>

    <!-- Export -->
    <div class="export-row">
      <button class="btn btn-success" onclick="exportExcel()">⬇ Export Excel (.xlsx)</button>
      <button class="btn btn-orange" onclick="exportPDF()">⬇ Export PDF</button>
    </div>

  </div>

  <!-- Empty state -->
  <div class="empty" id="empty-state">
    <div class="empty-icon">🗂️</div>
    <p>Choose a drive or enter a path and click <strong>Scan</strong> to begin.</p>
  </div>

</div>

<script>
let scanMode = 'local';
let lastResult = null;

function setMode(m) {
  scanMode = m;
  document.getElementById('local-panel').style.display = m === 'local' ? '' : 'none';
  document.getElementById('network-panel').style.display = m === 'network' ? '' : 'none';
  document.getElementById('btn-local').classList.toggle('active', m === 'local');
  document.getElementById('btn-network').classList.toggle('active', m === 'network');
}

async function loadDrives() {
  try {
    const r = await fetch('/api/drives');
    const drives = await r.json();
    const sel = document.getElementById('drive-select');
    sel.innerHTML = drives.map(d => `<option value="${d.letter}">${d.letter} ${d.label ? '— ' + d.label : ''}</option>`).join('');
    if (drives.length === 0) sel.innerHTML = '<option value="/">/ (root)</option>';
  } catch { }
}

function getScanPath() {
  if (scanMode === 'network') return document.getElementById('network-path').value.trim();
  const custom = document.getElementById('local-path').value.trim();
  return custom || document.getElementById('drive-select').value;
}

async function startScan() {
  const scanPath = getScanPath();
  if (!scanPath) { alert('Please enter a path to scan.'); return; }

  document.getElementById('results').style.display = 'none';
  document.getElementById('empty-state').style.display = 'none';
  showProgress(true);
  animateProgress();

  try {
    const r = await fetch('/api/scan', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ scanPath }) });
    if (!r.ok) { const e = await r.json(); throw new Error(e.error); }
    const data = await r.json();
    lastResult = data;
    renderResults(data);
  } catch (e) {
    alert('Scan failed: ' + e.message);
  } finally {
    showProgress(false);
  }
}

let progressInterval;
function showProgress(on) {
  const w = document.getElementById('progress-wrap');
  w.classList.toggle('visible', on);
  if (on) {
    document.getElementById('progress-bar').style.width = '0%';
    progressInterval = setInterval(() => {
      const bar = document.getElementById('progress-bar');
      const cur = parseFloat(bar.style.width) || 0;
      if (cur < 90) bar.style.width = (cur + Math.random() * 4) + '%';
    }, 200);
  } else {
    clearInterval(progressInterval);
    document.getElementById('progress-bar').style.width = '100%';
    setTimeout(() => { document.getElementById('progress-bar').style.width = '0%'; }, 400);
  }
}
function animateProgress() { }

function fmtBytes(b) {
  if (b === 0) return '0 B';
  const k = 1024, s = ['B','KB','MB','GB','TB'];
  const i = Math.floor(Math.log(b) / Math.log(k));
  return (b / Math.pow(k, i)).toFixed(2) + ' ' + s[i];
}

function tierClass(tier) {
  if (tier.includes('Extra')) return 'tier-xl';
  if (tier.includes('Large')) return 'tier-large';
  if (tier.includes('Mid')) return 'tier-mid';
  return 'tier-poc';
}

function renderResults({ tree, sizing }) {
  document.getElementById('results').style.display = '';
  document.getElementById('empty-state').style.display = 'none';

  // KPI
  document.getElementById('kpi-row').innerHTML = `
    <div class="stat-card">
      <div class="stat-value">${parseFloat(sizing.totalTB) >= 1 ? sizing.totalTB + ' TB' : sizing.totalGB + ' GB'}</div>
      <div class="stat-label">Total Data Size</div>
    </div>
    <div class="stat-card">
      <div class="stat-value">${Number(sizing.totalFiles).toLocaleString()}</div>
      <div class="stat-label">Total Files</div>
    </div>
    <div class="stat-card">
      <div class="stat-value"><span class="tier-badge ${tierClass(sizing.tier)}">${sizing.tier}</span></div>
      <div class="stat-label">NDC Deployment Tier</div>
    </div>
  `;

  // Tree
  document.getElementById('tree-container').innerHTML = renderTree(tree, 0);

  // Chart
  const top = (tree.children || []).slice(0, 10);
  const maxSize = top[0]?.size || 1;
  document.getElementById('chart-container').innerHTML = top.map(n => `
    <div class="bar-row">
      <div class="bar-label" title="${n.path}">📁 ${n.name}</div>
      <div class="bar-bg"><div class="bar-fill" style="width:${(n.size/maxSize*100).toFixed(1)}%"></div></div>
      <div class="bar-val">${fmtBytes(n.size)}</div>
    </div>
  `).join('');

  // Recommendations
  const s = sizing;
  document.getElementById('rec-container').innerHTML = `
    <table class="rec-table">
      <tr><th>Component</th><th>Specification</th><th>Value</th><th>Notes</th></tr>
      <tr>
        <td><strong>NDC Server(s)</strong></td>
        <td class="val">Count</td>
        <td class="val">${s.ndcServers} server${s.ndcServers > 1 ? 's' : ''}</td>
        <td>${s.ndcServers > 1 ? 'Clustered with DQS mode' : 'Single server deployment'}</td>
      </tr>
      <tr>
        <td></td>
        <td class="val">CPU per server</td>
        <td class="val">${s.ndcPerServer.cores} cores</td>
        <td></td>
      </tr>
      <tr>
        <td></td>
        <td class="val">RAM per server</td>
        <td class="val">${s.ndcPerServer.ramGB} GB</td>
        <td></td>
      </tr>
      <tr>
        <td></td>
        <td class="val">Index storage</td>
        <td class="val">${s.index.storageGB} GB</td>
        <td>35% of total data in scope — SSD required</td>
      </tr>
      <tr>
        <td><strong>SQL Server</strong></td>
        <td class="val">CPU</td>
        <td class="val">${s.sql.cores} cores</td>
        <td></td>
      </tr>
      <tr>
        <td></td>
        <td class="val">RAM</td>
        <td class="val">${s.sql.ramGB} GB</td>
        <td></td>
      </tr>
      <tr>
        <td></td>
        <td class="val">Database size</td>
        <td class="val">${s.sql.dbSizeGB} GB</td>
        <td>~11 KB per indexed object — SSD recommended</td>
      </tr>
      <tr>
        <td></td>
        <td class="val">Autogrowth</td>
        <td class="val">${s.sql.sqlAutogrowth}</td>
        <td>Recovery model: Simple | Max file size: Unlimited</td>
      </tr>
    </table>
    <div class="notes-box">⚠️ ${s.notes}<br/>💾 ${s.storageNote}</div>
  `;
}

function renderTree(node, depth) {
  const hasChildren = node.children && node.children.length > 0;
  const id = 'n' + Math.random().toString(36).slice(2);
  const indent = depth * 18;
  return `
    <div class="tree-node" style="padding-left:${indent + 8}px" onclick="${hasChildren ? `toggleNode('${id}')` : ''}">
      <span class="tree-toggle">${hasChildren ? '▶' : '·'}</span>
      <span class="node-name" title="${node.path}">📁 ${node.name}</span>
      <span class="node-size">${fmtBytes(node.size)}</span>
      <span class="node-files">${node.fileCount?.toLocaleString() || 0} files</span>
    </div>
    ${hasChildren ? `<div id="${id}" style="display:none">${node.children.map(c => renderTree(c, depth + 1)).join('')}</div>` : ''}
  `;
}

function toggleNode(id) {
  const el = document.getElementById(id);
  if (!el) return;
  const visible = el.style.display !== 'none';
  el.style.display = visible ? 'none' : '';
  const btn = el.previousElementSibling?.querySelector('.tree-toggle');
  if (btn) btn.textContent = visible ? '▶' : '▼';
}

async function exportExcel() {
  if (!lastResult) return;
  const r = await fetch('/api/export/excel', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(lastResult) });
  const blob = await r.blob();
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = 'NDC_Sizing_Report.xlsx'; a.click();
  URL.revokeObjectURL(url);
}

async function exportPDF() {
  if (!lastResult) return;
  const r = await fetch('/api/export/pdf', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(lastResult) });
  const blob = await r.blob();
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = 'NDC_Sizing_Report.pdf'; a.click();
  URL.revokeObjectURL(url);
}

// Init
loadDrives();
</script>
</body>
</html>
